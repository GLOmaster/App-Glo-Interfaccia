        window.onerror = function(msg, url, line) {

        };

    <style>
        body { 
            font-family: 'Montserrat', sans-serif; 
            padding: 20px; 
            background: #0f172a; 
            color: #f8fafc; 
            margin: 0; 
            line-height: 1.6;
        }

        h2 { 
            text-align: center; 
            color: #ffffff; 
            margin-top: 0; 
            font-weight: 700; 
            letter-spacing: 0.5px; 
            margin-bottom: 25px;
        }
        
        .section { 
            background: #1e293b; 
            padding: 25px 20px; 
            border-radius: 16px; 
            margin-bottom: 20px; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); 
            border: 1px solid #334155; 
        }
        
        label { 
            font-weight: 600; 
            color: #cbd5e1; 
            display: block; 
            margin-top: 15px; 
            margin-bottom: 8px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 12px;
        }
        
        input[type="text"], input[type="number"], input[type="time"], select { 
            width: 100%; 
            padding: 14px; 
            border-radius: 10px; 
            border: 1px solid #475569; 
            background: #0f172a; 
            color: #f1f5f9;
            font-size: 16px; 
            font-family: 'Montserrat', sans-serif;
            box-sizing: border-box; 
            transition: all 0.3s ease; 
        }
        
        input:focus, select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
            outline: none;
        }

        button { 
            font-family: 'Montserrat', sans-serif;
            color: white; 
            border: none; 
            font-weight: 700; 
            font-size: 16px; 
            padding: 16px; 
            margin-top: 10px; 
            width: 100%; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        button:active { transform: scale(0.97); } 
        
        .btn-menu { 
            height: 100px; 
            font-size: 20px; 
            margin-bottom: 20px; 
            background: linear-gradient(135deg, #0284c7, #0369a1);
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.3);
        }
        .btn-menu:hover { box-shadow: 0 12px 25px rgba(2, 132, 199, 0.4); transform: translateY(-2px); }
        
        .btn-rav { 
            background: linear-gradient(135deg, #059669, #047857);
            box-shadow: 0 8px 20px rgba(5, 150, 105, 0.3);
        }
        .btn-rav:hover { box-shadow: 0 12px 25px rgba(5, 150, 105, 0.4); transform: translateY(-2px); }

        .btn-monitor { 
            height: 80px; 
            font-size: 18px; 
            margin-bottom: 20px; 
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }
        .btn-monitor:hover { box-shadow: 0 12px 25px rgba(99, 102, 241, 0.4); transform: translateY(-2px); }

        .btn-genera { background: #0891b2; margin-bottom: 15px; }
        .btn-back { 
            background: #475569; 
            font-size: 14px; 
            padding: 12px; 
            margin-bottom: 20px; 
            color: #f1f5f9; 
            text-transform: none; 
        }
        .btn-stop { 
            background: linear-gradient(135deg, #dc2626, #b91c1c); 
            margin-top: 25px; 
            box-shadow: 0 8px 20px rgba(220, 38, 38, 0.3); 
        }
        .btn-reset { 
            background: transparent; 
            border: 1px solid #f59e0b; 
            color: #f59e0b; 
            font-size: 14px; 
            padding: 12px; 
            margin-top: 30px; 
            text-transform: none; 
        }
        
        .status-box { text-align: center; border-left: 4px solid #10b981; position: relative;}
        .status-title { margin: 0 0 10px 0; font-size: 14px; font-weight: 700; color: #cbd5e1; text-transform: uppercase; letter-spacing: 1px;}
        .status-value { font-size: 16px; font-weight: 600; margin: 0;}
        
        .gifting-box { 
            background: #422006; 
            padding: 15px; 
            border-radius: 12px; 
            border: 1px solid #78350f; 
            margin-top: 15px; 
        }
        .gifting-box label { color: #fcd34d; margin-top: 0; }

        .checkbox-group { 
            background: #0f172a; 
            border: 1px solid #334155; 
            padding: 15px; 
            border-radius: 12px; 
            margin-top: 10px; 
            margin-bottom: 15px; 
        }
        .checkbox-label { 
            font-weight: 500; 
            font-size: 15px; 
            display: flex; 
            align-items: center; 
            margin-bottom: 12px; 
            margin-top: 0; 
            cursor: pointer; 
            color: #cbd5e1;
            transition: color 0.2s;
        }
        .checkbox-label:hover { color: #ffffff; }
        .checkbox-label input { 
            width: auto; 
            margin-right: 12px; 
            transform: scale(1.4); 
            accent-color: #38bdf8; 
        }
        hr { border: 0; border-top: 1px solid #334155; margin: 15px 0; }

        .dynamic-section { 
            background: #1e293b; 
            border-left: 4px solid #10b981; 
            border-radius: 0 16px 16px 0;
            padding: 20px;
            margin-bottom: 20px; 
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
        }

        .run-card { background: #0f172a; padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #334155; }
        
        .btn-sniper {
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid #dc2626;
            color: #ef4444;
            padding: 6px 12px;
            font-size: 12px;
            width: auto;
            border-radius: 6px;
            margin-top: 0;
        }
        .btn-sniper:active { background: #dc2626; color: white; }

        .btn-info {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 8px;
            text-transform: none;
            width: auto;
            display: inline-block;
        }

        .btn-half {
            flex: 1;
            margin-top: 0;
            margin-bottom: 0;
            padding: 14px;
            font-size: 15px;
        }

        /* MODALE DI CARICAMENTO DINAMICO */
        #loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(5px);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .loader-box {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            width: 80%;
            max-width: 320px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
        }
        .spinner {
            width: 45px; height: 45px;
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .btn-hide-loader {
            background: transparent;
            border: 1px solid #475569;
            color: #94a3b8;
            font-size: 12px;
            padding: 8px 20px;
            margin-top: 25px;
            border-radius: 8px;
            width: auto;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-hide-loader:active { background: #334155; color: white; }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .screen { display: none; }
        .screen.active { 
            display: block; 
            animation: fadeSlideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; 
        }
    </style>

            <button class="btn-hide-loader" onclick="document.getElementById('loading-overlay').style.display='none'">Nascondi</button>
        </div>
    </div>

            GITHUB_TOKEN = localStorage.getItem('gh_token') || "";
            GITHUB_USER = localStorage.getItem('gh_user') || "";
        } catch(e) {
            console.warn("Memoria inaccessibile");
        }

        window.onload = async function() {
            try {
                var cronologia = JSON.parse(localStorage.getItem('hub_cronologia') || '[]');
                var limite = new Date().getTime() - (30 * 24 * 60 * 60 * 1000);
                var pulita = cronologia.filter(function(item) { return item.time > limite; });
                if(pulita.length !== cronologia.length) {
                    localStorage.setItem('hub_cronologia', JSON.stringify(pulita));
                }
            } catch(e) {}

            try {
                if(!GITHUB_TOKEN) {
                    var tokenInserito = prompt("Primo avvio: Inserisci il tuo Token GitHub.");
                    if(tokenInserito) {
                        GITHUB_TOKEN = tokenInserito.trim();
                        localStorage.setItem('gh_token', GITHUB_TOKEN);
                    } else {
                        alert("Senza token l'app non funzionerà.");
                    }
                }
                
                if(GITHUB_TOKEN) {
                    await verificaConnessione();
                }

                var savedOp = localStorage.getItem('saved_operatore') || "";
                if(savedOp) {
                    document.getElementById('tab_operatore').value = savedOp;
                    document.getElementById('rav_operatore').value = savedOp;
                }
                
                generaModuliRav();
            } catch(e) {
                alert("Errore di caricamento: " + e.message);
            }
        };

        function vibraErrore() {
            try { if ("vibrate" in navigator) navigator.vibrate([200, 100, 200]); } catch(e) {}
        }

        function salvaOperatore(valore) {
            try {
                localStorage.setItem('saved_operatore', valore);
                document.getElementById('tab_operatore').value = valore;
                document.getElementById('rav_operatore').value = valore;
            } catch(e) {}
        }

        function salvaInCronologiaLocale(nomeBot, dati) {
            try {
                var cronologia = JSON.parse(localStorage.getItem('hub_cronologia') || '[]');
                cronologia.push({ time: new Date().getTime(), bot: nomeBot, dati: dati });
                localStorage.setItem('hub_cronologia', JSON.stringify(cronologia));
            } catch(e) {}
        }

        function svuotaMemoria() {
            var conferma = confirm("🗑️ Vuoi cancellare definitivamente tutta la memoria dei dettagli sul tuo telefono?");
            if(conferma) {
                try {
                    localStorage.removeItem('hub_cronologia');
                    alert("✅ Memoria locale svuotata con successo!");
                } catch(e) {
                    alert("Errore di memoria.");
                }
            }
        }

        function resetToken() {
            var nuovoToken = prompt("Inserisci il nuovo Token GitHub:");
            if(nuovoToken) {
                GITHUB_TOKEN = nuovoToken.trim();
                try {
                    localStorage.setItem('gh_token', GITHUB_TOKEN);
                    localStorage.removeItem('gh_user'); 
                } catch(e) {}
                verificaConnessione();
            }
        }

        async function verificaConnessione() {
            if(!GITHUB_TOKEN) return;
            var divStato = document.getElementById('stato-connessione');
            
            divStato.innerText = "Sincronizzazione in corso...";
            divStato.style.color = "#fbbf24";

            try {
                var userRes = await fetch("https://api.github.com/user", {
                    headers: { 'Authorization': 'Bearer ' + GITHUB_TOKEN }
                });
                
                if(!userRes.ok) {
                    divStato.innerText = "❌ Errore: Token non valido.";
                    divStato.style.color = "#ef4444";
                    return;
                }
                
                var userData = await userRes.json();
                GITHUB_USER = userData.login; 
                try { localStorage.setItem('gh_user', GITHUB_USER); } catch(e){}
                divStato.innerText = "✅ Connesso come: " + GITHUB_USER;
                divStato.style.color = "#10b981";

            } catch(e) {
                divStato.innerText = "❌ Offline (Verifica Rete)";
                divStato.style.color = "#ef4444";
            }
        }

        async function caricaMonitor() {
            if(!GITHUB_TOKEN || !GITHUB_USER) return;
            var container = document.getElementById('monitor-lista');
            container.innerHTML = '<p style="text-align:center; color:#38bdf8; font-size:14px;">📡 Contattando il server...</p>';
            
            try {
                var url = "https://api.github.com/repos/" + GITHUB_USER + "/" + GITHUB_REPO + "/actions/runs?per_page=12";
                var res = await fetch(url, {
                    headers: { 'Authorization': 'Bearer ' + GITHUB_TOKEN }
                });
                
                if(res.ok) {
                    var data = await res.json();
                    var runs = data.workflow_runs;
                    
                    if(runs.length === 0) {
                        container.innerHTML = '<p style="text-align:center; color:#cbd5e1; font-size:14px;">Nessun bot avviato di recente.</p>';
                        return;
                    }
                    
                    var html = '';
                    for(var i=0; i<runs.length; i++) {
                        var run = runs[i];
                        var icona = '⏳';
                        var colore = '#fbbf24'; 
                        var statoTxt = 'In Coda';
                        var btnSniper = '';
                        
                        if(run.status === 'in_progress' || run.status === 'queued') { 
                            if(run.status === 'in_progress') { icona = '🔄'; colore = '#38bdf8'; statoTxt = 'In Esecuzione'; }
                            btnSniper = '<button class="btn-sniper" onclick="fermaSingoloBot(' + run.id + ')">🛑 STOP</button>';
                        } else if(run.status === 'completed') {
                            if(run.conclusion === 'success') { icona = '✅'; colore = '#10b981'; statoTxt = 'Completato'; }
                            else { icona = '❌'; colore = '#ef4444'; statoTxt = 'Fallito'; }
                        }
                        
                        var d = new Date(run.created_at);
                        var nomeData = ("0"+d.getDate()).slice(-2) + "/" + ("0"+(d.getMonth()+1)).slice(-2) + " " + ("0"+d.getHours()).slice(-2) + ":" + ("0"+d.getMinutes()).slice(-2);
                        
                        var operatoreTesto = run.display_title || run.name;
                        var btnInfo = '<span class="btn-info" onclick="mostraDettagli(\'' + run.created_at + '\')">ℹ️ Info</span>';

                        html += '<div class="run-card" style="border-left: 4px solid ' + colore + ';">' +
                            '<div style="display: flex; justify-content: space-between; align-items: center;">' +
                                '<strong style="color: #f8fafc; font-size: 15px;">' + run.name + btnInfo + '</strong>' +
                                '<span style="font-size: 12px; color: #cbd5e1;">' + nomeData + '</span>' +
                            '</div>' +
                            '<div style="font-size: 13px; color: #94a3b8; margin-top: 4px;">' +
                                '👤 Operatore: <strong style="color: #cbd5e1;">' + operatoreTesto + '</strong>' +
                            '</div>' +
                            '<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">' +
                                '<div style="font-size: 14px; font-weight: 600; color: ' + colore + ';">' + icona + ' ' + statoTxt + '</div>' +
                                btnSniper +
                            '</div>' +
                        '</div>';
                    }
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<p style="text-align:center; color:#ef4444; font-size:14px;">Errore API nel caricamento.</p>';
                }
            } catch(e) {
                container.innerHTML = '<p style="text-align:center; color:#ef4444; font-size:14px;">Errore di rete.</p>';
            }
        }

        function mostraDettagli(runTimeStr) {
            try {
                var runTime = new Date(runTimeStr).getTime();
                var cronologia = JSON.parse(localStorage.getItem('hub_cronologia') || '[]');
                var trovati = cronologia.filter(function(item) {
                    return Math.abs(item.time - runTime) < (3 * 60000); 
                });

                if(trovati.length === 0) {
                    alert("📄 Dettagli non trovati nel tuo telefono.");
                    return;
                }

                var msg = "📊 DETTAGLI REGISTRATI SUL TELEFONO:\n---------------------------------------\n";
                for(var i=0; i<trovati.length; i++) {
                    var d = trovati[i].dati;
                    if(d.locale) {
                        msg += "📍 Locale: " + d.locale + "\n";
                        msg += "🔄 GLO: " + d.cicli + " | VELO: " + d.cicli_velo + " | VUSE: " + d.cicli_vuse + "\n";
                    } else {
                        msg += "🧑‍💼 Promoter: " + d.promoter + "\n";
                        msg += "🔄 GLO: " + d.n_glo + " | VELO: " + d.n_velo + " | VUSE: " + d.n_vuse + "\n";
                    }
                    msg += "---------------------------------------\n";
                }
                alert(msg);
            } catch(e) {
                alert("Errore nella lettura dei dettagli.");
            }
        }

        async function fermaSingoloBot(runId) {
            if(!GITHUB_TOKEN || !GITHUB_USER) return;
            vibraErrore();
            var conferma = confirm("⚠️ Vuoi interrompere questo specifico server?");
            if(!conferma) return;

            try {
                var cancelUrl = "https://api.github.com/repos/" + GITHUB_USER + "/" + GITHUB_REPO + "/actions/runs/" + runId + "/cancel";
                var res = await fetch(cancelUrl, { method: 'POST', headers: { 'Authorization': 'Bearer ' + GITHUB_TOKEN }});
                if(res.ok) {
                    alert("🛑 Server fermato con successo.");
                    caricaMonitor(); 
                } else {
                    alert("Errore nell'arrestare il processo.");
                }
            } catch(e) {
                alert("Errore di connessione a GitHub.");
            }
        }

        function mostraSchermata(idSchermata) {
            var screens = document.querySelectorAll('.screen');
            for(var i=0; i<screens.length; i++) {
                screens[i].classList.remove('active');
            }
            document.getElementById(idSchermata).classList.add('active');
            window.scrollTo(0,0);
        }

        function gestisciVeloTutti() {
            if (document.getElementById('tab_velo_tutti').checked) {
                var cbs = document.querySelectorAll('.tab_velo_opt');
                for(var i=0; i<cbs.length; i++) cbs[i].checked = false;
            }
        }
        function gestisciVeloSingoli() {
            var scelti = document.querySelectorAll('.tab_velo_opt:checked').length;
            if (scelti > 0) document.getElementById('tab_velo_tutti').checked = false;
            else document.getElementById('tab_velo_tutti').checked = true;
        }
        function ottieniStringaVelo() {
            if (document.getElementById('tab_velo_tutti').checked) return "tutti";
            var arrayScelti = [];
            var cbs = document.querySelectorAll('.tab_velo_opt:checked');
            for(var i=0; i<cbs.length; i++) arrayScelti.push(cbs[i].value);
            return arrayScelti.join(",");
        }
        function gestisciMostraGifting() {
            var selezione = document.getElementById('tab_tipo_gifting').value;
            var sezioneNum = document.getElementById('tab_sezione_num_gifting');
            if (selezione === "purple_grape") sezioneNum.style.display = "block";
            else {
                sezioneNum.style.display = "none";
                document.getElementById('tab_cicli_gifting').value = "0";
            }
        }

        function avviaTableau() {
            var operatore = document.getElementById('tab_operatore').value.trim();
            var locale = document.getElementById('tab_locale').value.trim();
            var nGlo = parseInt(document.getElementById('tab_cicli').value) || 0;
            var nVelo = parseInt(document.getElementById('tab_cicli_velo').value) || 0;
            var nVuse = parseInt(document.getElementById('tab_cicli_vuse').value) || 0;
            var nGift = parseInt(document.getElementById('tab_cicli_gifting').value) || 0;

            if(!operatore) { vibraErrore(); alert("⚠️ Errore: Inserisci il nome dell'Operatore!"); return; }
            if(!locale) { vibraErrore(); alert("⚠️ Errore: Inserisci il nome del Locale!"); return; }
            
            if(nGlo === 0 && nVelo === 0 && nVuse === 0 && nGift === 0) {
                vibraErrore();
                alert("🛑 BLOCCO ANTI-SPRECO: Tutti i contatori sono a 0.");
                return;
            }

            var dati = {
                operatore: operatore,
                locale: locale,
                menu: document.getElementById('tab_menu').value,
                cicli: nGlo.toString(),
                cicli_velo: nVelo.toString(),
                prodotti_velo: ottieniStringaVelo(),
                cicli_vuse: nVuse.toString(),
                cicli_gifting: nGift.toString()
            };

            var orario = document.getElementById('tab_ora_avvio').value;
            gestisciTimer([dati], orario, 'bot.yml', 'Tableau');
        }

        function generaModuliRav() {
            var num = parseInt(document.getElementById('rav_num_promoters').value) || 1;
            var container = document.getElementById('rav_moduli_container');
            container.innerHTML = ''; 

            for(var i=1; i<=num; i++) {
                var div = document.createElement('div');
                div.className = 'section dynamic-section';
                div.innerHTML = '<h4 style="margin-top:0; margin-bottom: 10px; color:#10b981; font-size: 18px; font-weight: 700;">🧑‍💼 Promoter ' + i + '</h4>' +
                    '<label>Nome Promoter</label>' +
                    '<input type="text" id="rav_promoter_' + i + '" list="lista-promoter" placeholder="Inizia a digitare o tocca...">' +
                    '<label>Cicli GLO</label>' +
                    '<input type="number" id="rav_n_glo_' + i + '" value="0">' +
                    '<label>Cicli VELO</label>' +
                    '<input type="number" id="rav_n_velo_' + i + '" value="0">' +
                    '<label>Cicli VUSE</label>' +
                    '<input type="number" id="rav_n_vuse_' + i + '" value="0">';
                container.appendChild(div);
            }
        }

        function avviaRav() {
            var operatore = document.getElementById('rav_operatore').value.trim();
            if(!operatore) { vibraErrore(); alert("⚠️ Errore: Inserisci il tuo nome (Operatore)!"); return; }

            var num = parseInt(document.getElementById('rav_num_promoters').value) || 1;
            var orario = document.getElementById('rav_ora_avvio').value;
            var payloadsMultipli = [];

            for(var i=1; i<=num; i++) {
                var promoter = document.getElementById('rav_promoter_' + i).value.trim();
                var nGlo = parseInt(document.getElementById('rav_n_glo_' + i).value) || 0;
                var nVelo = parseInt(document.getElementById('rav_n_velo_' + i).value) || 0;
                var nVuse = parseInt(document.getElementById('rav_n_vuse_' + i).value) || 0;

                if(!promoter) { 
                    vibraErrore(); 
                    alert("⚠️ Errore: Inserisci il nome per il Promoter " + i + "!"); 
                    return; 
                }

                if(nGlo === 0 && nVelo === 0 && nVuse === 0) {
                    vibraErrore();
                    alert("🛑 BLOCCO ANTI-SPRECO (Promoter " + i + "): Contatori a 0.");
                    return;
                }

                payloadsMultipli.push({
                    operatore: operatore, 
                    promoter: promoter,
                    n_glo: nGlo.toString(),
                    n_velo: nVelo.toString(),
                    n_vuse: nVuse.toString()
                });
            }
            gestisciTimer(payloadsMultipli, orario, 'bot-rav.yml', 'RAV');
        }

        function gestisciTimer(payloads, orario, workflowFile, nomeBot) {
            if(!GITHUB_TOKEN || !GITHUB_USER) {
                alert("Manca il Token o l'utente.");
                return;
            }

            try { if ("vibrate" in navigator) navigator.vibrate(50); } catch(e){}

            if(orario) {
                var oraAttuale = new Date();
                var parti = orario.split(':');
                var oraAvvio = new Date();
                oraAvvio.setHours(parseInt(parti[0], 10), parseInt(parti[1], 10), 0, 0);

                if (oraAvvio.getTime() <= oraAttuale.getTime()) oraAvvio.setDate(oraAvvio.getDate() + 1);
                
                var attesa = oraAvvio.getTime() - oraAttuale.getTime();
                alert("✅ Programmati!\nLascia l'app in background fino alle " + orario);
                setTimeout(function() { inviaRichiestaMultipla(payloads, workflowFile, nomeBot); }, attesa);
            } else {
                inviaRichiestaMultipla(payloads, workflowFile, nomeBot);
            }
        }

        // --- MOTORE DI INVIO CON LOADER DINAMICO A 3 FASI REALI E TASTO NASCONDI ---
        async function inviaRichiestaMultipla(payloads, workflowFile, nomeBot) {
            var overlay = document.getElementById('loading-overlay');
            var loaderText = document.getElementById('loader-text');
            overlay.style.display = 'flex';

            var successCount = 0;
            
            try {
                loaderText.innerText = "🌐 Invio dati al cloud di GitHub...";
                await new Promise(r => setTimeout(r, 600));

                for(var i=0; i<payloads.length; i++) {
                    salvaInCronologiaLocale(nomeBot, payloads[i]);

                    var url = "https://api.github.com/repos/" + GITHUB_USER + "/" + GITHUB_REPO + "/actions/workflows/" + workflowFile + "/dispatches";
                    var res = await fetch(url, {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/vnd.github.v3+json',
                            'Authorization': 'Bearer ' + GITHUB_TOKEN,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ ref: 'main', inputs: payloads[i] })
                    });
                    if(res.ok) successCount++;
                    await new Promise(r => setTimeout(r, 400));
                }

                loaderText.innerText = "⚙️ Registrazione coda sul server...";
                await new Promise(r => setTimeout(r, 800)); 

                loaderText.innerText = "🚀 Avvio Macchina Virtuale completato!";
                await new Promise(r => setTimeout(r, 500));

            } catch(e) {
                console.error("Errore di rete");
            } finally {
                overlay.style.display = 'none';
            }

            if(successCount > 0) {
                try { if ("vibrate" in navigator) navigator.vibrate([100, 50, 100]); } catch(e){}
                alert("✅ Inviati " + successCount + " moduli con successo!");
            } else {
                vibraErrore();
                alert("Errore di invio a " + workflowFile + ".");
            }
        }

        async function fermaBot(workflowFile, nomeBot) {
            if(!GITHUB_TOKEN || !GITHUB_USER) { alert("Manca Token/Utente."); return; }

            vibraErrore();
            var conferma = confirm("⚠️ Sicuro di voler ARRESTARE tutti i server generali di " + nomeBot + "?");
            if(!conferma) return;

            var urlRuns = "https://api.github.com/repos/" + GITHUB_USER + "/" + GITHUB_REPO + "/actions/workflows/" + workflowFile + "/runs?per_page=10";
            try {
                var res = await fetch(urlRuns, { headers: { 'Authorization': 'Bearer ' + GITHUB_TOKEN }});
                if(res.ok) {
                    var data = await res.json();
                    var activeRuns = [];
                    for(var i=0; i<data.workflow_runs.length; i++) {
                        if(data.workflow_runs[i].status === 'in_progress' || data.workflow_runs[i].status === 'queued') {
                            activeRuns.push(data.workflow_runs[i]);
                        }
                    }

                    if(activeRuns.length === 0) { alert("Nessun processo attivo per " + nomeBot + "."); return; }

                    var stoppedCount = 0;
                    for(var j=0; j<activeRuns.length; j++) {
                        var cancelUrl = "https://api.github.com/repos/" + GITHUB_USER + "/" + GITHUB_REPO + "/actions/runs/" + activeRuns[j].id + "/cancel";
                        var cancelRes = await fetch(cancelUrl, { method: 'POST', headers: { 'Authorization': 'Bearer ' + GITHUB_TOKEN }});
                        if(cancelRes.ok) stoppedCount++;
                    }
                    if(stoppedCount > 0) alert("🛑 " + stoppedCount + " server fermati.");
                    else alert("Errore nell'arrestare i processi.");
                } else alert("Errore API.");
            } catch(e) { alert("Errore di connessione a GitHub."); }
        }
    </script>
