<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub Automazioni GLO</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f9; margin: 0; }
        .section { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .dynamic-section { background: #e9ecef; border-left: 4px solid #28a745; margin-bottom: 15px; }
        label { font-weight: bold; font-size: 14px; color: #333; display: block; margin-top: 10px; }
        input[type="text"], input[type="number"], input[type="time"], select { width: 100%; padding: 12px; margin: 8px 0 15px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
        
        button { background: #007bff; color: white; border: none; font-weight: bold; font-size: 18px; padding: 15px; margin-top: 5px; width: 100%; border-radius: 8px; cursor: pointer; }
        button:active { background: #0056b3; }
        
        .btn-menu { height: 100px; font-size: 22px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-rav { background: #28a745; }
        .btn-rav:active { background: #218838; }
        .btn-genera { background: #17a2b8; margin-bottom: 15px; }
        .btn-genera:active { background: #138496; }
        .btn-back { background: #6c757d; font-size: 16px; padding: 10px; margin-bottom: 15px; }
        .btn-back:active { background: #5a6268; }
        .btn-stop { background: #dc3545; margin-top: 15px; box-shadow: 0 2px 4px rgba(220,53,69,0.3); }
        .btn-stop:active { background: #c82333; }
        .btn-reset { background: #ffc107; color: #333; font-size: 14px; padding: 10px; margin-top: 20px; }

        h2 { text-align: center; color: #222; margin-top: 0; }
        
        .checkbox-group { background: #fafafa; border: 1px solid #ddd; padding: 10px; border-radius: 8px; margin-top: 8px; margin-bottom: 15px; }
        .checkbox-label { font-weight: normal; font-size: 15px; display: flex; align-items: center; margin-bottom: 8px; margin-top: 0; cursor: pointer; }
        .checkbox-label input { width: auto; margin-right: 10px; transform: scale(1.3); }
        hr { border: 0; border-top: 1px solid #eee; margin: 10px 0; }

        .screen { display: none; }
        .screen.active { display: block; }
    </style>
</head>

    <!-- SCRIPT LOGICA E GITHUB -->
    <script>
        let GITHUB_TOKEN = localStorage.getItem('gh_token');
        const GITHUB_USER = "GLOmaster"; 
        const GITHUB_REPO = "BOT"; 

        // Richiesta token al primo avvio
        window.onload = function() {
            if(!GITHUB_TOKEN) {
                let tokenInserito = prompt("Primo avvio: Inserisci il tuo Token GitHub per collegare l'app al server privato.");
                if(tokenInserito) {
                    GITHUB_TOKEN = tokenInserito.trim();
                    localStorage.setItem('gh_token', GITHUB_TOKEN);
                    aggiornaMinuti(); // Lancia controllo minuti
                } else {
                    alert("Attenzione: Senza token l'app non potrà comunicare con GitHub.");
                }
            } else {
                aggiornaMinuti(); // Lancia controllo minuti se token già presente
            }
        };

        function resetToken() {
            let nuovoToken = prompt("Inserisci il nuovo Token GitHub:");
            if(nuovoToken) {
                GITHUB_TOKEN = nuovoToken.trim();
                localStorage.setItem('gh_token', GITHUB_TOKEN);
                alert("Token aggiornato con successo!");
                aggiornaMinuti();
            }
        }

        // --- NUOVA FUNZIONE CONTATORE MINUTI ---
        async function aggiornaMinuti() {
            if(!GITHUB_TOKEN) return;
            const url = `https://api.github.com/users/${GITHUB_USER}/settings/billing/actions`;
            const divMinuti = document.getElementById('minuti-residui');
            
            try {
                divMinuti.innerText = "...";
                divMinuti.style.color = "#17a2b8";
                divMinuti.style.fontSize = "28px";
                
                const res = await fetch(url, {
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Authorization': `Bearer ${GITHUB_TOKEN}`
                    }
                });
                
                if(res.ok) {
                    const data = await res.json();
                    const minutiUsati = data.total_minutes_used;
                    const minutiRestanti = 2000 - minutiUsati;
                    
                    divMinuti.innerText = minutiRestanti;
                    
                    // Colori di allerta
                    if(minutiRestanti < 500) divMinuti.style.color = "#ffc107"; // Giallo
                    if(minutiRestanti < 100) divMinuti.style.color = "#dc3545"; // Rosso
                    
                } else {
                    divMinuti.innerText = "Errore API";
                    divMinuti.style.fontSize = "18px";
                }
            } catch(e) {
                divMinuti.innerText = "Errore Rete";
                divMinuti.style.fontSize = "18px";
            }
        }

        // Navigazione
        function mostraSchermata(idSchermata) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(idSchermata).classList.add('active');
        }

        // ------------------ LOGICA TABLEAU ------------------
        function gestisciVeloTutti() {
            if (document.getElementById('tab_velo_tutti').checked) {
                document.querySelectorAll('.tab_velo_opt').forEach(cb => cb.checked = false);
            }
        }
        function gestisciVeloSingoli() {
            const scelti = document.querySelectorAll('.tab_velo_opt:checked').length;
            if (scelti > 0) {
                document.getElementById('tab_velo_tutti').checked = false;
            } else {
                document.getElementById('tab_velo_tutti').checked = true;
            }
        }
        function ottieniStringaVelo() {
            if (document.getElementById('tab_velo_tutti').checked) return "tutti";
            let arrayScelti = [];
            document.querySelectorAll('.tab_velo_opt:checked').forEach(cb => arrayScelti.push(cb.value));
            return arrayScelti.join(",");
        }
        function gestisciMostraGifting() {
            const selezione = document.getElementById('tab_tipo_gifting').value;
            const sezioneNum = document.getElementById('tab_sezione_num_gifting');
            if (selezione === "purple_grape") {
                sezioneNum.style.display = "block";
            } else {
                sezioneNum.style.display = "none";
                document.getElementById('tab_cicli_gifting').value = "0";
            }
        }

        function avviaTableau() {
            const dati = {
                operatore: document.getElementById('tab_operatore').value,
                locale: document.getElementById('tab_locale').value,
                menu: document.getElementById('tab_menu').value,
                cicli: document.getElementById('tab_cicli').value || "0",
                cicli_velo: document.getElementById('tab_cicli_velo').value || "0",
                prodotti_velo: ottieniStringaVelo(),
                cicli_vuse: document.getElementById('tab_cicli_vuse').value || "0",
                cicli_gifting: document.getElementById('tab_cicli_gifting').value || "0"
            };

            const orario = document.getElementById('tab_ora_avvio').value;
            gestisciTimer([dati], orario, 'bot.yml', 'Tableau');
        }

        // ------------------ LOGICA RAV (GENERAZIONE DINAMICA) ------------------
        function generaModuliRav() {
            const num = parseInt(document.getElementById('rav_num_promoters').value) || 1;
            const container = document.getElementById('rav_moduli_container');
            container.innerHTML = ''; 

            for(let i=1; i<=num; i++) {
                const div = document.createElement('div');
                div.className = 'section dynamic-section';
                div.innerHTML = `
                    <h4 style="margin-top:0; margin-bottom: 5px; color:#28a745; font-size: 18px;">🧑‍💼 Promoter ${i}</h4>
                    
                    <label>Nome Promoter:</label>
                    <input type="text" id="rav_promoter_${i}" list="lista-promoter" placeholder="Inizia a digitare o tocca...">

                    <label>Numero Cicli GLO:</label>
                    <input type="number" id="rav_n_glo_${i}" value="0">
                    
                    <label>Numero Cicli VELO:</label>
                    <input type="number" id="rav_n_velo_${i}" value="0">

                    <label>Numero Cicli VUSE:</label>
                    <input type="number" id="rav_n_vuse_${i}" value="0">
                `;
                container.appendChild(div);
            }
        }

        generaModuliRav();

        function avviaRav() {
            const operatore = document.getElementById('rav_operatore').value || "Sconosciuto";
            const num = parseInt(document.getElementById('rav_num_promoters').value) || 1;
            const orario = document.getElementById('rav_ora_avvio').value;

            let payloadsMultipli = [];

            for(let i=1; i<=num; i++) {
                const promoter = document.getElementById(`rav_promoter_${i}`).value;
                const n_glo = document.getElementById(`rav_n_glo_${i}`).value || "0";
                const n_velo = document.getElementById(`rav_n_velo_${i}`).value || "0";
                const n_vuse = document.getElementById(`rav_n_vuse_${i}`).value || "0";

                if(!promoter) {
                    alert(`Attenzione: Inserisci il nome per il Promoter ${i}!`);
                    return; 
                }

                payloadsMultipli.push({
                    operatore: operatore,
                    promoter: promoter,
                    n_glo: n_glo,
                    n_velo: n_velo,
                    n_vuse: n_vuse
                });
            }

            gestisciTimer(payloadsMultipli, orario, 'bot-rav.yml', 'RAV');
        }

        // ------------------ MOTORE DI INVIO UNIVERSALE ------------------
        function gestisciTimer(payloads, orario, workflowFile, nomeBot) {
            if(!GITHUB_TOKEN) {
                alert("Errore: Manca il Token GitHub. Clicca su 'Cambia Token Sicurezza' nella schermata principale.");
                return;
            }

            if(orario) {
                const oraAttuale = new Date();
                const [ore, minuti] = orario.split(':');
                const oraAvvio = new Date();
                oraAvvio.setHours(parseInt(ore, 10), parseInt(minuti, 10), 0, 0);

                if (oraAvvio.getTime() <= oraAttuale.getTime()) {
                    oraAvvio.setDate(oraAvvio.getDate() + 1);
                }
                
                const attesa = oraAvvio.getTime() - oraAttuale.getTime();
                alert(`✅ Bot ${nomeBot} programmati!\nLascia lo schermo dell'app acceso per garantire l'avvio all'orario stabilito.`);
                
                setTimeout(() => { 
                    inviaRichiestaMultipla(payloads, workflowFile, nomeBot); 
                }, attesa);
            } else {
                inviaRichiestaMultipla(payloads, workflowFile, nomeBot);
            }
        }

        async function inviaRichiestaMultipla(payloads, workflowFile, nomeBot) {
            let successCount = 0;
            
            for(let dati of payloads) {
                const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/actions/workflows/${workflowFile}/dispatches`;
                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/vnd.github.v3+json',
                            'Authorization': `Bearer ${GITHUB_TOKEN}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ ref: 'main', inputs: dati })
                    });
                    
                    if(res.ok) successCount++;
                } catch(e) { 
                    console.error("Errore di rete", e); 
                }
                await new Promise(r => setTimeout(r, 500));
            }

            if(successCount > 0) {
                alert(`✅ Inviati ${successCount} comandi con successo! Controlla Telegram.`);
                // Aggiorna i minuti visualizzati dopo 5 secondi dall'avvio
                setTimeout(aggiornaMinuti, 5000); 
            } else {
                alert(`Errore di invio. Verifica che il Token inserito sia corretto e abbia i permessi per le Actions.`);
            }
        }

        // ------------------ STOP EMERGENZA ------------------
        async function fermaBot(workflowFile, nomeBot) {
            if(!GITHUB_TOKEN) {
                alert("Manca il Token GitHub.");
                return;
            }

            const conferma = confirm(`⚠️ ATTENZIONE: Sei sicuro di voler BLOCCARE forzatamente l'esecuzione di ${nomeBot}? Verranno arrestati TUTTI i server attualmente in corso per questo bot.`);
            if(!conferma) return;

            const urlRuns = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/actions/workflows/${workflowFile}/runs?per_page=10`;
            try {
                const res = await fetch(urlRuns, {
                    headers: {
                        'Accept': 'application/vnd.github.v3+json',
                        'Authorization': `Bearer ${GITHUB_TOKEN}`
                    }
                });
                
                if(res.ok) {
                    const data = await res.json();
                    const activeRuns = data.workflow_runs.filter(r => r.status === 'in_progress' || r.status === 'queued');

                    if(activeRuns.length === 0) {
                        alert(`Nessun processo attivo trovato per ${nomeBot} in questo momento.`);
                        return;
                    }

                    let stoppedCount = 0;
                    for(let run of activeRuns) {
                        const cancelUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/actions/runs/${run.id}/cancel`;
                        const cancelRes = await fetch(cancelUrl, {
                            method: 'POST',
                            headers: {
                                'Accept': 'application/vnd.github.v3+json',
                                'Authorization': `Bearer ${GITHUB_TOKEN}`
                            }
                        });
                        if(cancelRes.ok) stoppedCount++;
                    }

                    if(stoppedCount > 0) {
                        alert(`🛑 Segnale di stop inviato con successo a ${stoppedCount} server di ${nomeBot}.`);
                    } else {
                        alert(`Si è verificato un problema nell'arrestare i processi.`);
                    }

                } else {
                    alert(`Errore. Verifica il Token inserito.`);
                }
            } catch(e) {
                alert(`Errore di connessione a GitHub.`);
            }
        }
    </script>
