<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub Automazioni GLO</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Montserrat', sans-serif; 
            padding: 20px; 
            background: #0f172a; 
            color: #f8fafc; 
            margin: 0; 
            line-height: 1.6;
        }

        h2 { 
            text-align: center; 
            color: #ffffff; 
            margin-top: 0; 
            font-weight: 700; 
            letter-spacing: 0.5px; 
            margin-bottom: 25px;
        }
        
        .section { 
            background: #1e293b; 
            padding: 25px 20px; 
            border-radius: 16px; 
            margin-bottom: 20px; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); 
            border: 1px solid #334155; 
        }
        
        label { 
            font-weight: 600; 
            color: #cbd5e1; 
            display: block; 
            margin-top: 15px; 
            margin-bottom: 8px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 12px;
        }
        
        input[type="text"], input[type="number"], input[type="time"], select { 
            width: 100%; 
            padding: 14px; 
            border-radius: 10px; 
            border: 1px solid #475569; 
            background: #0f172a; 
            color: #f1f5f9;
            font-size: 16px; 
            font-family: 'Montserrat', sans-serif;
            box-sizing: border-box; 
            transition: all 0.3s ease; 
        }
        
        input:focus, select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
            outline: none;
        }

        button { 
            font-family: 'Montserrat', sans-serif;
            color: white; 
            border: none; 
            font-weight: 700; 
            font-size: 16px; 
            padding: 16px; 
            margin-top: 10px; 
            width: 100%; 
            border-radius: 12px; 
            cursor: pointer; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        button:active { transform: scale(0.97); } 
        
        .btn-menu { 
            height: 100px; 
            font-size: 20px; 
            margin-bottom: 20px; 
            background: linear-gradient(135deg, #0284c7, #0369a1);
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.3);
        }
        .btn-menu:hover { box-shadow: 0 12px 25px rgba(2, 132, 199, 0.4); transform: translateY(-2px); }
        
        .btn-rav { 
            background: linear-gradient(135deg, #059669, #047857);
            box-shadow: 0 8px 20px rgba(5, 150, 105, 0.3);
        }
        .btn-rav:hover { box-shadow: 0 12px 25px rgba(5, 150, 105, 0.4); transform: translateY(-2px); }

        .btn-monitor { 
            height: 80px; 
            font-size: 18px; 
            margin-bottom: 20px; 
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }
        .btn-monitor:hover { box-shadow: 0 12px 25px rgba(99, 102, 241, 0.4); transform: translateY(-2px); }

        .btn-genera { background: #0891b2; margin-bottom: 15px; }
        .btn-back { 
            background: #475569; 
            font-size: 14px; 
            padding: 12px; 
            margin-bottom: 20px; 
            color: #f1f5f9; 
            text-transform: none; 
        }
        .btn-stop { 
            background: linear-gradient(135deg, #dc2626, #b91c1c); 
            margin-top: 25px; 
            box-shadow: 0 8px 20px rgba(220, 38, 38, 0.3); 
        }
        .btn-reset { 
            background: transparent; 
            border: 1px solid #f59e0b; 
            color: #f59e0b; 
            font-size: 14px; 
            padding: 12px; 
            margin-top: 30px; 
            text-transform: none; 
        }
        
        .status-box { text-align: center; border-left: 4px solid #10b981; position: relative;}
        .status-title { margin: 0 0 10px 0; font-size: 14px; font-weight: 700; color: #cbd5e1; text-transform: uppercase; letter-spacing: 1px;}
        .status-value { font-size: 16px; font-weight: 600; margin: 0;}
        
        .gifting-box { 
            background: #422006; 
            padding: 15px; 
            border-radius: 12px; 
            border: 1px solid #78350f; 
            margin-top: 15px; 
        }
        .gifting-box label { color: #fcd34d; margin-top: 0; }

        .checkbox-group { 
            background: #0f172a; 
            border: 1px solid #334155; 
            padding: 15px; 
            border-radius: 12px; 
            margin-top: 10px; 
            margin-bottom: 15px; 
        }
        .checkbox-label { 
            font-weight: 500; 
            font-size: 15px; 
            display: flex; 
            align-items: center; 
            margin-bottom: 12px; 
            margin-top: 0; 
            cursor: pointer; 
            color: #cbd5e1;
            transition: color 0.2s;
        }
        .checkbox-label:hover { color: #ffffff; }
        .checkbox-label input { 
            width: auto; 
            margin-right: 12px; 
            transform: scale(1.4); 
            accent-color: #38bdf8; 
        }
        hr { border: 0; border-top: 1px solid #334155; margin: 15px 0; }

        .dynamic-section { 
            background: #1e293b; 
            border-left: 4px solid #10b981; 
            border-radius: 0 16px 16px 0;
            padding: 20px;
            margin-bottom: 20px; 
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
        }

        .run-card { background: #0f172a; padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #334155; }
        
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .screen { display: none; }
        .screen.active { 
            display: block; 
            animation: fadeSlideIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; 
        }
    </style>
</head>
<body>

    <!-- SCHERMATA PRINCIPALE -->
    <div id="screen-home" class="screen active">
        <h2>HUB AUTOMAZIONI</h2>

        <!-- MONITOR DI STATO SERVER -->
        <div class="section status-box">
            <p class="status-title">📡 Stato di Rete</p>
            <p id="stato-connessione" class="status-value" style="color: #fbbf24;">Sincronizzazione in corso...</p>
        </div>

        <div class="section" style="background: transparent; box-shadow: none; padding: 0; border: none;">
            <button class="btn-menu btn-monitor" onclick="mostraSchermata('screen-monitor'); caricaMonitor();">🖥️ Monitor di Sistema</button>
            <button class="btn-menu" onclick="mostraSchermata('screen-tableau')">📊 Avvia TABLEAU</button>
            <button class="btn-menu btn-rav" onclick="mostraSchermata('screen-rav')">📝 Avvia RAV</button>
        </div>
        <button class="btn-reset" onclick="resetToken()">🔑 Cambia Token Sicurezza</button>
    </div>

    <!-- SCHERMATA MONITOR -->
    <div id="screen-monitor" class="screen">
        <button class="btn-back" onclick="mostraSchermata('screen-home')">⬅ Torna alla Home</button>
        <h2>Monitor di Sistema</h2>
        
        <div class="section">
            <button class="btn-genera" onclick="caricaMonitor()">🔄 Aggiorna Adesso</button>
            <div id="monitor-lista" style="margin-top: 15px;">
                <p style="text-align:center; color:#cbd5e1; font-size:14px;">Caricamento stato server...</p>
            </div>
        </div>
    </div>

    <!-- SCHERMATA TABLEAU -->
    <div id="screen-tableau" class="screen">
        <button class="btn-back" onclick="mostraSchermata('screen-home')">⬅ Torna alla Home</button>
        <h2>Configura Tableau</h2>
        
        <div class="section">
            <label>Operatore</label>
            <input type="text" id="tab_operatore" placeholder="Tuo Nome" oninput="salvaOperatore(this.value)">

            <label>Locale</label>
            <input type="text" id="tab_locale" placeholder="Es. AI BOTTAI">

            <label>Menu Proposte (1-10)</label>
            <select id="tab_menu">
                <option value="1">1. GLO</option>
                <option value="2">2. GLO+GIFTING</option>
                <option value="3">3. GLO+VELO</option>
                <option value="4">4. GLO+VELO+GIFTING</option>
                <option value="5">5. GLO+VELO+VUSE</option>
                <option value="6">6. GLO+VELO+VUSE+GIFTING</option>
                <option value="7">7. GLO+VUSE</option>
                <option value="8">8. GLO+VUSE+GIFTING</option>
                <option value="9">9. VELO+VUSE</option>
                <option value="10">10. VELO+VUSE+GIFTING</option>
            </select>

            <label>Cicli Totali (GLO o Inserimenti)</label>
            <input type="number" id="tab_cicli" value="5">
        </div>

        <div class="section">
            <label>Cicli VELO (se previsti)</label>
            <input type="number" id="tab_cicli_velo" value="0">
            
            <label>Prodotti VELO</label>
            <div class="checkbox-group">
                <label class="checkbox-label"><input type="checkbox" id="tab_velo_tutti" value="tutti" checked onchange="gestisciVeloTutti()"> Tutti (Casuale)</label>
                <hr>
                <label class="checkbox-label"><input type="checkbox" class="tab_velo_opt" value="1" onchange="gestisciVeloSingoli()"> 1. Spearmint 4mg</label>
                <label class="checkbox-label"><input type="checkbox" class="tab_velo_opt" value="2" onchange="gestisciVeloSingoli()"> 2. Icy Berries 4mg</label>
                <label class="checkbox-label"><input type="checkbox" class="tab_velo_opt" value="3" onchange="gestisciVeloSingoli()"> 3. Spearmint 10mg</label>
                <label class="checkbox-label"><input type="checkbox" class="tab_velo_opt" value="4" onchange="gestisciVeloSingoli()"> 4. Tropical Mango 10mg</label>
                <label class="checkbox-label"><input type="checkbox" class="tab_velo_opt" value="5" onchange="gestisciVeloSingoli()"> 5. Peppermint 14mg</label>
                <label class="checkbox-label"><input type="checkbox" class="tab_velo_opt" value="6" onchange="gestisciVeloSingoli()"> 6. Purple Grape 8mg</label>
            </div>

            <label>Cicli VUSE (se previsti)</label>
            <input type="number" id="tab_cicli_vuse" value="0">
        </div>

        <div class="section">
            <label>Opzioni GIFTING</label>
            <select id="tab_tipo_gifting" onchange="gestisciMostraGifting()">
                <option value="nessuno">1. Nessuno</option>
                <option value="purple_grape">2. Velo purple grape 4mg</option>
            </select>

            <div id="tab_sezione_num_gifting" class="gifting-box" style="display: none;">
                <label>Quanti gifting in totale? <br><span style="font-size: 11px; font-weight: 400; color: #fcd34d;">(⚠️ DIMEZZA IL NUMERO INSERITO)</span></label>
                <input type="number" id="tab_cicli_gifting" value="0" style="margin-bottom: 0;">
            </div>
        </div>

        <div class="section">
            <label>Orario Avvio (Opzionale)</label>
            <input type="time" id="tab_ora_avvio">
        </div>

        <button onclick="avviaTableau()">🚀 Avvia Tableau</button>
        <button class="btn-stop" onclick="fermaBot('bot.yml', 'Tableau')">🛑 STOP EMERGENZA</button>
    </div>

            <button class="btn-genera" onclick="generaModuliRav()">⚙️ Genera Moduli</button>

        <div class="section">
